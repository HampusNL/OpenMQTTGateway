[platformio]
default_envs = esp32c3-supermini-pilight-cc1101

[env:esp32c3-supermini-pilight-cc1101]
platform = ${com.esp32_platform}
platform_packages = ${com.esp32_platform_packages}

board = esp32-c3-devkitm-1
board_build.partitions = min_spiffs.csv

extra_scripts =
  pre:scripts/add_c_flags.py
  pre:scripts/add_mlongcalls.py

lib_deps =
  ${com-esp32.lib_deps}
  ${libraries.esppilight}
  ${libraries.smartrc-cc1101-driver-lib}

build_flags =
  ${com-esp32.build_flags}

  '-DNO_INT_TEMP_READING'

  '-DZgatewayPilight="Pilight"'
  '-DZradioCC1101="CC1101"'
  '-DGateway_Name="OMG_C3_Pilight_CC1101"'

  '-DRF_RECEIVER_GPIO=4'
  '-DRF_EMITTER_GPIO=3'

  '-DRF_CC1101_SCK=6'
  '-DRF_CC1101_MISO=5'
  '-DRF_CC1101_MOSI=7'
  '-DRF_CC1101_CS=10'

  '-DARDUINO_USB_CDC_ON_BOOT=1'
  '-DARDUINO_USB_MODE=1'

monitor_speed = 115200